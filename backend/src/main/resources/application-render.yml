spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:dpg-db28p8uk1f9s739iapng-a}:5432/${DB_NAME:pricepulse_305q}
    username: ${DB_USER:pricepulse}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  mail:
    host: ${SPRING_MAIL_HOST:smtp.sendgrid.net}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:apikey}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

management:
  health:
    mail:
      enabled: false

pricepulse:
  auth:
    cookie-secure: true
  scheduler:
    interval-ms: ${PRICEPULSE_SCHEDULER_INTERVAL_MS:1800000}

logging:
  level:
    com.pricepulse: INFO
    org.springframework.security: WARN
