spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    user:
      # Disable default Spring Security auto-configured user
      name: disabled
      password: disabled

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

pricepulse:
  auth:
    cookie-secure: true
  scheduler:
    interval-ms: ${PRICEPULSE_SCHEDULER_INTERVAL_MS:1800000}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.pricepulse: INFO
    org.springframework.security: WARN
